spring:
  application.name: metasearch
  datasource:
    url: jdbc:mysql://localhost:3306/metasearch?connectionTimeZone=UTC&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: secret
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: metasearch-pool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000        # ms to wait for a connection from the pool before failing fast
      idle-timeout: 300000            # 5 min
      max-lifetime: 1200000           # 20 min, keep well under MySQL's wait_timeout (default 8h, but many managed MySQL/proxies cut it much shorter)
      validation-timeout: 3000
      connection-test-query: SELECT 1 # only needed for very old drivers, but harmless safety net
      leak-detection-threshold: 30000 # logs a warning if a connection is held >30s — great for catching leaks
  jpa:
    hibernate.ddl-auto: none
    show-sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/seed
standard-ebooks:
  token: TOKEN
  opds-url: https://standardebooks.org/feeds/opds/all

gutenberg-australia:
  enabled: true
  always-reindex: false